name: soya-flight-booking

x-app: &app
  build: .
  restart: unless-stopped
  init: true

x-sentinel: &sentinel
  image: redis:7.4-alpine
  restart: unless-stopped
  entrypoint: ["sh", "/config/sentinel.sh"]
  environment:
    REDIS_MASTER_IP: ${REDIS_NET_PREFIX:-172.30.76}.10
  volumes: ["./docker/sentinel.sh:/config/sentinel.sh:ro"]
  depends_on:
    redis-master: {condition: service_healthy}
    redis-replica: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 3s
    timeout: 2s
    retries: 20

services:
  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: ${FLIGHT_DB_PASSWORD:-flight_dev}
      POSTGRES_DB: flights
    volumes: ["flight-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flights"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_dev}
      POSTGRES_DB: bookings
    volumes: ["booking-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookings"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  redis-master:
    image: redis:7.4-alpine
    environment: {REDIS_ROLE: master}
    entrypoint: ["sh", "/config/redis.sh"]
    volumes: ["./docker/redis.sh:/config/redis.sh:ro", "redis-master-data:/data"]
    networks:
      default: {ipv4_address: "${REDIS_NET_PREFIX:-172.30.76}.10"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  redis-replica:
    image: redis:7.4-alpine
    environment:
      REDIS_ROLE: replica
      REDIS_MASTER_IP: ${REDIS_NET_PREFIX:-172.30.76}.10
    entrypoint: ["sh", "/config/redis.sh"]
    volumes: ["./docker/redis.sh:/config/redis.sh:ro", "redis-replica-data:/data"]
    networks:
      default: {ipv4_address: "${REDIS_NET_PREFIX:-172.30.76}.11"}
    depends_on:
      redis-master: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  sentinel-1:
    <<: *sentinel
    volumes: ["./docker/sentinel.sh:/config/sentinel.sh:ro", "sentinel-1-data:/data"]
    networks:
      default: {ipv4_address: "${REDIS_NET_PREFIX:-172.30.76}.20"}
  sentinel-2:
    <<: *sentinel
    volumes: ["./docker/sentinel.sh:/config/sentinel.sh:ro", "sentinel-2-data:/data"]
    networks:
      default: {ipv4_address: "${REDIS_NET_PREFIX:-172.30.76}.21"}
  sentinel-3:
    <<: *sentinel
    volumes: ["./docker/sentinel.sh:/config/sentinel.sh:ro", "sentinel-3-data:/data"]
    networks:
      default: {ipv4_address: "${REDIS_NET_PREFIX:-172.30.76}.22"}
  flight-service:
    <<: *app
    command: ["python", "-m", "flight_service.server"]
    environment: &flight-env
      FLIGHT_DATABASE_URL: postgresql://flight:${FLIGHT_DB_PASSWORD:-flight_dev}@flight-db:5432/flights
      GRPC_API_KEY: ${GRPC_API_KEY:-local-development-key}
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: flight-cache
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    depends_on:
      flight-db: {condition: service_healthy}
      sentinel-1: {condition: service_healthy}
      sentinel-2: {condition: service_healthy}
      sentinel-3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "flight"]
      interval: 5s
      timeout: 4s
      retries: 20
  booking-service:
    <<: *app
    command: ["python", "-m", "booking_service.app"]
    ports: ["${BOOKING_PORT:-8080}:8080"]
    environment: &booking-env
      BOOKING_DATABASE_URL: postgresql://booking:${BOOKING_DB_PASSWORD:-booking_dev}@booking-db:5432/bookings
      FLIGHT_GRPC_TARGET: flight-service:50051
      GRPC_API_KEY: ${GRPC_API_KEY:-local-development-key}
      GRPC_TIMEOUT_SECONDS: ${GRPC_TIMEOUT_SECONDS:-2}
      GRPC_BACKOFF_SECONDS: ${GRPC_BACKOFF_SECONDS:-0.1}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RESET_TIMEOUT_SECONDS: ${CB_RESET_TIMEOUT_SECONDS:-10}
      CB_WINDOW_SECONDS: ${CB_WINDOW_SECONDS:-30}
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-5}
      RECOVERY_GRACE_SECONDS: ${RECOVERY_GRACE_SECONDS:-30}
    depends_on:
      booking-db: {condition: service_healthy}
      flight-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "booking"]
      interval: 5s
      timeout: 4s
      retries: 20
  tests:
    <<: *app
    profiles: ["test"]
    restart: "no"
    command: ["pytest", "-v"]
    environment:
      <<: [*flight-env, *booking-env]
      TEST_INTEGRATION: "1"
    depends_on:
      booking-service: {condition: service_healthy}

volumes:
  flight-db:
  booking-db:
  redis-master-data:
  redis-replica-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${REDIS_NET_PREFIX:-172.30.76}.0/24

